name: farmassist-watchwolf

services:
  servers-manager:
    image: ghcr.io/sarhatabaot/watchwolf-servers-manager:v0.4.1
    ports:
      - "8000:8000"
    environment:
      MACHINE_IP: 127.0.0.1
      PUBLIC_IP: 127.0.0.1
      PARENT_PWD: /servers
      SERVER_PATH_SHIFT: .
      WATCHWOLF_MINECRAFT_RUNTIME: itzg
      WATCHWOLF_ITZG_IMAGE: itzg/minecraft-server
      WATCHWOLF_ITZG_TAG: auto
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - watchwolf_logs:/servers/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 2s
      retries: 24

  clients-manager:
    image: ghcr.io/sarhatabaot/watchwolf-clients-manager:v0.4.1
    ports:
      - "7000-7199:7000-7199"
    environment:
      MACHINE_IP: 127.0.0.1
      PUBLIC_IP: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"127.0.0.1\", 7000), 2).close()'"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  watchwolf_logs:
