# Publishes the jar from a freshly-published GitHub Release to Modrinth.
# Fires automatically after the release.yml workflow publishes a release.
#
# Uses the official Modrinth Publish action:
#   https://github.com/marketplace/actions/modrinth-publish
#
# Required secrets (set in repo settings → Secrets and variables → Actions):
#   MODRINTH_TOKEN       — https://modrinth.com/settings/pats (scope: versions:write)
#   MODRINTH_PROJECT_ID  — the Modrinth project id (slug or numeric id)

name: Modrinth Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish version to Modrinth
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Modrinth
        uses: modrinth/publish@v1
        with:
          # The Modrinth project id (slug like "farmassistreboot" or numeric id).
          project: ${{ secrets.MODRINTH_PROJECT_ID }}
          # PAT with versions:write scope.
          token: ${{ secrets.MODRINTH_TOKEN }}
          # Glob the jar uploaded by release.yml.
          files: ./build/libs/FarmAssistReboot-*.jar
          # Strip a leading "v" from the tag (e.g. v1.5.0 → 1.5.0).
          version: ${{ github.event.release.tag_name }}
          version-type: release
          # The release body becomes the Modrinth changelog.
          changelog: ${{ github.event.release.body }}
          # Paper is the only supported runtime.
          loaders: paper
          # Supported MC versions. Adjust when you bump the supported range.
          game-versions: |
            1.20.1
            1.20.4
            1.20.6
            1.21
            1.21.1
            1.21.3
            1.21.4
            1.21.5
          # New plugins are unfeatured by default; flip to true if you want
          # the release to appear on the project page.
          featured: false
