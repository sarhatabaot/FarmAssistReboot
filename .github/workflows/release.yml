# Builds the shaded plugin jar on tag push (e.g. v1.5.0) and attaches
# it to a GitHub Release. Auto-generates release notes from the commits
# since the previous tag.
#
# No secrets are required for this workflow.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by softprops/action-gh-release to create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build the shaded jar (defined in build.gradle.kts → shadowJar).
      # Output: build/libs/FarmAssistReboot-<version>.jar
      - name: Build shaded jar
        run: ./gradlew shadowJar

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag name (e.g. v1.5.0) as both tag and release name.
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/FarmAssistReboot-*.jar
